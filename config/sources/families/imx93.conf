# NXP i.MX93 family configuration
#

# shellcheck source=config/sources/families/include/imx93_common.inc
source "${BASH_SOURCE%/*}/include/imx93_common.inc"

# i.MX93 needs for boot:
# - ATF (Arm Trusted Firmware)
# - ELE firmware (EdgeLock Enclave)
# - DDR firmware
# - U-Boot

# Board-specific adjustments
case $BOARD in
	imx93-var-som)
		# Variscite VAR-SOM-iMX93
		ATFSOURCE='https://github.com/varigit/imx-atf.git'
		ATFBRANCH='commit:bed39c167c883b335d5fc1046ce16e10a611b4c4'
		BOOTSOURCE='https://github.com/varigit/uboot-imx.git'
		BOOTBRANCH='commit:df4294afa29d98060fe05290942a76e0d3dfb16c'
		;;
esac

# Kernel configuration per branch
case $BOARD in
	imx93-var-som)
		LINUXCONFIG='linux-imx93-var-'$BRANCH
		case $BRANCH in
			current)
				KERNEL_MAJOR_MINOR="6.6"
				KERNELSOURCE='https://github.com/varigit/linux-imx.git'
				KERNELBRANCH='commit:fe3a35cdc16e7dfd63ff19d5b8dbc5cd32485494'
				;;
		esac
		;;
esac

# ATF target map - must be set after ATF_PLAT is defined in board config
declare -g ATF_TARGET_MAP="PLAT=${ATF_PLAT} bl31;;build/${ATF_PLAT}/release/bl31.bin"

# Bootloader related - download and prepare firmware
pre_config_uboot_target() {
	display_alert "Downloading NXP firmware for iMX93" "${IMX_FIRMWARE}" "info"

	# Get the i.MX firmware (DDR training)
	if [[ ! -d "${IMX_FIRMWARE}" ]]; then
		rm -rf ${IMX_FIRMWARE}*
		curl -fL "https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/${IMX_FIRMWARE}.bin" -o "${IMX_FIRMWARE}.bin" || {
			echo "Download of IMX_FIRMWARE failed"
			rm -f "${IMX_FIRMWARE}.bin"
			exit 1
		}
		chmod +x ${IMX_FIRMWARE}.bin
		./${IMX_FIRMWARE}.bin --auto-accept
	fi

	# Get the ELE firmware (EdgeLock Enclave)
	if [[ ! -d "${IMX_ELE_FIRMWARE}" ]]; then
		rm -rf ${IMX_ELE_FIRMWARE}*
		curl -fL "https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/${IMX_ELE_FIRMWARE}.bin" -o "${IMX_ELE_FIRMWARE}.bin" || {
			echo "Download of IMX_ELE_FIRMWARE failed"
			rm -f "${IMX_ELE_FIRMWARE}.bin"
			exit 1
		}
		chmod +x ${IMX_ELE_FIRMWARE}.bin
		./${IMX_ELE_FIRMWARE}.bin --auto-accept
	fi

	# Get imx-mkimage
	local mkimage_dir="${SRC}/cache/sources/imx-mkimage"
	if [[ ! -d "${mkimage_dir}" ]]; then
		display_alert "Cloning imx-mkimage" "${IMX_MKIMAGE_GIT}" "info"
		git clone --depth 1 "${IMX_MKIMAGE_GIT}" "${mkimage_dir}"
	fi

	# Checkout specific commit if defined
	if [[ -n "${IMX_MKIMAGE_COMMIT}" ]]; then
		(cd "${mkimage_dir}" && git fetch --depth 1 origin "${IMX_MKIMAGE_COMMIT}" && git checkout "${IMX_MKIMAGE_COMMIT}") || true
	fi
}

# Post-process U-Boot: create flash.bin using imx-mkimage (same method as flexbuild)
# This replicates what flexbuild does in src/bsp/imx_mkimage.mk
uboot_custom_postprocess() {
	display_alert "Creating flash.bin using imx-mkimage" "iMX93" "info"

	local uboot_dir="$(pwd)"
	local mkimage_dir="${SRC}/cache/sources/imx-mkimage"
	local soc_dir="${mkimage_dir}/iMX93"

	# Firmware directories (were extracted in pre_config_uboot_target, need full paths)
	local fw_dir="${uboot_dir}/${IMX_FIRMWARE}"
	local ele_dir="${uboot_dir}/${IMX_ELE_FIRMWARE}"

	# Clean soc_dir first
	display_alert "Cleaning imx-mkimage iMX93 dir" "${soc_dir}" "debug"
	make -C "${soc_dir}" -f soc.mak clean 2>/dev/null || true
	rm -f "${soc_dir}"/*.bin "${soc_dir}"/*.img "${soc_dir}"/*.hash 2>/dev/null || true

	# Step 1: Build mkimage_imx8 tool (must be in imx-mkimage dir, as soc.mak uses ../mkimage_imx8)
	display_alert "Building mkimage_imx8 tool" "imx-mkimage" "info"
	make -C "${mkimage_dir}" clean 2>/dev/null || true
	# Force output to be in mkimage_dir, not current working directory
	make -C "${mkimage_dir}" bin MKIMG="${mkimage_dir}/mkimage_imx8" || exit_with_error "mkimage_imx8 build failed"
	# Verify it was built
	[[ -x "${mkimage_dir}/mkimage_imx8" ]] || exit_with_error "mkimage_imx8 not found at ${mkimage_dir}/mkimage_imx8"

	# Prepare working directory - copy all required files (same as flexbuild)
	display_alert "Copying firmware and binaries to imx-mkimage/iMX93" "${soc_dir}" "info"

	# Copy DDR firmware (all .bin files from synopsys dir, like flexbuild does)
	cp "${fw_dir}/firmware/ddr/synopsys/"*.bin "${soc_dir}/" || exit_with_error "Missing DDR firmware from ${fw_dir}"

	# Copy ELE/AHAB firmware (mx93a*-ahab-container.img)
	cp "${ele_dir}/"mx93a*-ahab-container.img "${soc_dir}/" || exit_with_error "Missing AHAB container from ${ele_dir}"

	# Copy U-Boot SPL
	cp "${uboot_dir}/spl/u-boot-spl.bin" "${soc_dir}/" || exit_with_error "Missing u-boot-spl.bin"

	# Copy U-Boot
	cp "${uboot_dir}/u-boot.bin" "${soc_dir}/" || exit_with_error "Missing u-boot.bin"

	# Copy u-boot-nodtb.bin (needed by flexbuild)
	cp "${uboot_dir}/u-boot-nodtb.bin" "${soc_dir}/" 2>/dev/null || true

	# Copy ATF bl31.bin
	cp "${uboot_dir}/bl31.bin" "${soc_dir}/" || exit_with_error "Missing bl31.bin"

	# Copy mkimage_uboot from u-boot tools (needed for container creation)
	cp "${uboot_dir}/tools/mkimage" "${soc_dir}/mkimage_uboot" || exit_with_error "Missing mkimage tool from u-boot"
	chmod +x "${soc_dir}/mkimage_uboot"

	# List files for debugging
	display_alert "Files in iMX93 dir" "$(ls ${soc_dir}/*.bin ${soc_dir}/*.img 2>/dev/null | xargs -n1 basename | tr '\n' ' ')" "info"

	# Build flash.bin using soc.mak (same command as flexbuild: make SOC=iMX93 REV=A1 -C iMX93 -f soc.mak flash_singleboot)
	display_alert "Running imx-mkimage flash_singleboot (SOC=iMX93 REV=A1)" "iMX93" "info"
	(cd "${mkimage_dir}" && make SOC=iMX93 REV=A1 -C iMX93 -f soc.mak flash_singleboot) || exit_with_error "flash_singleboot failed"

	# Copy resulting flash.bin back to u-boot directory
	cp "${soc_dir}/flash.bin" "${uboot_dir}/" || exit_with_error "flash.bin not created"

	display_alert "flash.bin created successfully" "$(ls -lh "${uboot_dir}/flash.bin")" "info"
}

write_uboot_platform() {
	dd if=$1/flash.bin of=$2 bs=1K seek=${OFFSET} status=noxfer conv=fsync > /dev/null 2>&1
}

family_tweaks_bsp() {
	:
}
